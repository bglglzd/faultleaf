name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m ruff check faultleaf tests
      - run: python -m unittest discover -s tests -v
      - run: python -m faultleaf suite --repeat --out reports/suite.json
      - run: python -m faultleaf replay FL04 --reduce --out reports/lost-ack
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
